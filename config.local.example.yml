app:
  name: sp13sx
  data_dir: ~/.sp13sx
  log_level: info

ui:
  theme: default
  layout: dual-pane
  show_tool_calls: true
  show_timestamps: true
  right_pane_width: 40

defaults:
  # 这里选择默认 backend 名称，对应 backends 下的 key
  backend: private_openai
  # 这里填写默认模型名
  model: your-model-name
  skill_dirs:
    - ~/.codex/skills
    - ./.agent/skills
    - ./examples/skills
  enabled_skills: []
  session_title_mode: auto

backends:
  private_openai:
    # 当前实现要求服务兼容 OpenAI Responses API
    type: openai-responses
    # 私有 API 地址
    base_url: https://your-api.example.com/v1
    # API Key 从环境变量读取
    api_key_env: PRIVATE_OPENAI_API_KEY
    # 如无需要可留空
    organization_env: ""
    project_env: ""
    request:
      temperature: 1
      max_output_tokens: 4096
      timeout_seconds: 120
      reasoning_effort: medium

tools:
  builtin:
    read_file:
      enabled: true
    list_files:
      enabled: true
    run_command:
      enabled: true
      allowlist:
        - git status
        - git diff
        - go test ./...
      timeout_seconds: 30
      max_output_bytes: 65536

mcp:
  servers:
    - name: filesystem
      enabled: false
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
      env: {}
      cwd: .
      startup_timeout_seconds: 15

skills:
  auto_discover: true
  prefer_frontmatter_name: true
  allow_project_skills: true

sessions:
  auto_resume_last: true
  max_history_messages: 200
  summarize_threshold: 120

storage:
  conversations_dir: ~/.sp13sx/conversations
  state_dir: ~/.sp13sx/state
