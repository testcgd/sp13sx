# tool_chain - 工具链调用场景
# 测试多工具调用和工具执行流程

name: tool_chain
description: 测试多工具链式调用

turns:
  # 第一轮：读取文件并分析
  - match_input: "读取 main.go 并分析"
    response_id: "resp_001"
    events:
      - type: status
        content: "正在读取文件..."
        delay: 50ms
      - type: tool_call
        tool_call:
          id: "tool_1"
          call_id: "call_001"
          name: "read_file"
          arguments:
            path: "main.go"
        delay: 100ms

  # 第二轮：处理 read_file 结果后的响应
  - match_previous_response: "resp_001"
    match_tools_applied: ["read_file"]
    response_id: "resp_002"
    events:
      - type: message
        content: "我已读取文件内容。\n\n"
        delay: 50ms
      - type: message
        content: "这是一个 Go 程序入口文件。"
        delay: 100ms
